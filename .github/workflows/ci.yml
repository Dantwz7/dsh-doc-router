name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run lint
      # Deliberately no `npm install`: the suite runs against local stubs, so a
      # bare clone must be enough. If this step ever needs an install, the
      # stub design has been broken.
      - name: Unit tests
        run: npm run test:unit

  integration:
    name: integration · ${{ matrix.os }} · PyMuPDF
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The unit job already runs on Windows, but it uses local stubs and never
        # starts Python. Interpreter resolution, non-ASCII paths and backslash
        # separators are Windows-only code paths, and the development machine is
        # Windows — so the integration job has to cover it too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: pip install pymupdf4llm
      # Windows has no `python3`, and a bare `python` can be the Microsoft Store
      # alias. Asking the interpreter where it is (`sys.executable`) is the one
      # answer that is true on both platforms.
      - name: Point the plugin at the CI interpreter (Linux)
        if: runner.os != 'Windows'
        run: echo "DOC_ROUTER_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Point the plugin at the CI interpreter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          "DOC_ROUTER_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Full test suite
        run: npm test
      - name: Fixtures still route as documented
        run: npm run fixtures

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Guards the `files` allow-list: a missing LICENSE or a shipped
      # __pycache__ fails the build instead of reaching the registry.
      - run: npm run verify:package

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Renaming a README heading silently rots every anchor that points at it —
      # including `.github/ISSUE_TEMPLATE/config.yml`. This check makes that fail
      # here instead of in a user's browser.
      - run: npm run verify:docs
